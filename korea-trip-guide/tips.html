<h1>

⚠️ 韓国旅行で注意すること

</h1>



<div class="place">

<h2>

💸 タクシー・料金トラブル

</h2>

<p>

観光地では遠回りや料金トラブルの話もあるため、
配車アプリ（Kakao T）を使うと安心。
目的地は韓国語住所を見せるのがおすすめ。

</p>

</div>




<div class="place">

<h2>

🦀 生もの・屋台グルメ

</h2>

<p>

生の海鮮や慣れない食べ物で体調を崩す場合も。
体調に不安がある人は加熱されたものを選ぶと安心。

</p>

</div>




<div class="place">

<h2>

🗺 Google MapよりNaver Map

</h2>

<p>

韓国ではGoogle Mapが使いづらい場所があるため、
Naver Mapを事前に入れておくと便利。

</p>

</div>




<div class="place">

<h2>

🚇 終電・営業時間

</h2>

<p>

地下鉄の終電やカフェの営業時間は日本と違う場合があるので要確認。

</p>

</div>
